[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-mpl"
version = "1.4.0"
description = "PROTEUS Thermocline matplotlib theme: brand color cycles, phase colormaps, light + dark variants."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PROTEUS collaboration", email = "dev@proteus-framework.org" }]
dependencies = ["matplotlib>=3.8"]
keywords = ["matplotlib", "style", "theme", "PROTEUS", "planetary-science"]
classifiers = [
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://formingworlds.github.io/proteus-visual-language"
Repository = "https://github.com/FormingWorlds/proteus-visual-language"
Changelog = "https://github.com/FormingWorlds/proteus-visual-language/blob/main/CHANGELOG.md"

[project.optional-dependencies]
validation = ["pillow>=11.3"]
test = ["pytest", "pillow>=11.3", "hypothesis"]

[project.entry-points.pytest11]
"proteus_mpl.pytest_plugin" = "proteus_mpl.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proteus_mpl = ["*.mplstyle", "fonts/*"]
